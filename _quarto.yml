format:
  html:
    theme: [cosmo, css/theme.scss]
    code-fold: true
    code-summary: "Show code"
    anchor-sections: true
    smooth-scroll: true
    link-external-newwindow: true
    link-external-icon: false
    include-after-body: chunks/nav-click.html
    link-external-filter: '^(?:http:|https:)\/\/(?:www\.)?climateindicators\.us'

execute:
  echo: true
  eval: false
  warning: false
  message: false
code-link: true
knitr:
  opts_chunk:
    comment: "#>"
fig-retina: 3
toc-location: right
toc: true
