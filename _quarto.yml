project:
  type: website
  output-dir: _site
  preview:
    port: 5679
    browser: true
  render:
    - "!chunks/"
    - "**/*.qmd"
  resources:
    - images/

website:
  title: TrackingClimateImpacts.us
  llms-txt: true
  site-url: https://climateindicators.us
  repo-url: https://github.com/climateindicators/climateindicators.us
  back-to-top-navigation: true
  open-graph:
    site-name: TrackingClimateImpacts.us
  page-footer:
    background: dark
    center:
      - text: "Site made with <i class='bi bi-heart-fill'></i>, <i class='bi bi-git'></i></a>, and <img src='/images/icon-quarto.svg' width=13 style='vertical-align:-1px;margin-right:0.25em'><a href='https://quarto.org/' target='_blank'>Quarto</a>"

  navbar:
    title: "Tracking<span class='logo-accent'>Climate</span>Impacts"
    background: light
    collapse-below: xl
    search: true
    right:
      - text: "About"
        menu:
          - text: "About"
            href: about.qmd
          - text: "Where We’re Heading"
            href: where-were-heading.qmd
      - text: "Emissions & Climate Resources"
